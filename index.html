<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>نظام التداول التعليمي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#FFD700;--gold2:#B8860B;--green:#00D4AA;--red:#FF4B6E;
  --blue:#00BFFF;--purple:#9B59B6;--orange:#FF8C00;--btc:#F7931A;
  --bg:#070707;--bg2:#0E0D00;--bg3:#080800;
  --border:#1E1500;--border2:#141000;
  --text:#E8D5A3;--text2:#888;--text3:#444;--text4:#333;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2A1800;border-radius:2px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes shimmer{0%,100%{opacity:.4}50%{opacity:1}}
.blink{animation:blink 1.2s infinite}
.sh{animation:shimmer 1.3s linear infinite}
button{font-family:'Cairo',sans-serif;cursor:pointer;transition:opacity .2s}
button:hover{opacity:.8}
button:disabled{opacity:.5;cursor:not-allowed}

/* HEADER */
#hdr{position:sticky;top:0;z-index:200;background:linear-gradient(180deg,#0F0E00,#0A0900);border-bottom:1px solid var(–border);box-shadow:0 2px 20px rgba(255,200,0,.06)}
#ticker{height:46px;overflow:hidden}
#hdr-main{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 4px;gap:8px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo-orb{width:38px;height:38px;background:linear-gradient(135deg,var(–gold),var(–gold2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 14px rgba(255,215,0,.3);flex-shrink:0}
.logo-title{font-size:14px;font-weight:900;color:var(–gold);line-height:1.2}
.logo-sub{font-size:9px;color:var(–text4)}
#pboxes{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.pbox{display:flex;align-items:center;gap:4px;background:#0A0900;border:1px solid #1A1100;border-radius:8px;padding:3px 9px}
.pbox-icon{font-size:9px}.pbox-id{font-size:9px;color:var(–text3)}
.pbox-val{font-size:13px;font-weight:bold;font-family:monospace}
.pbox-arr{font-size:10px}
.up .pbox-val,.up .pbox-arr{color:var(–green)}
.down .pbox-val,.down .pbox-arr{color:var(–red)}
.neu .pbox-val,.neu .pbox-arr{color:var(–text2)}
#srow{display:flex;align-items:center;gap:4px;font-size:9px;color:var(–text4);justify-content:flex-end;margin-top:4px}
.sdot{font-size:8px}
.slive .sdot{color:var(–green);animation:blink 1.2s infinite}
.sconn .sdot{color:var(–gold);animation:blink 1.2s infinite}
.serr .sdot{color:var(–red)}
#mkttabs{display:flex;gap:6px;overflow-x:auto;padding:6px 14px 10px;border-top:1px solid #161000}
.mbt{padding:5px 14px;border-radius:20px;font-size:12px;white-space:nowrap;border:1px solid #241800;background:transparent;color:#555}
.mbt.on{font-weight:bold}
#tabs{display:flex;gap:2px;overflow-x:auto;padding:7px 14px;background:#050500;border-bottom:1px solid var(–border2)}
.tbt{padding:6px 12px;border-radius:8px;border:none;background:transparent;color:#3A3A3A;font-size:11px;border-bottom:2px solid transparent;white-space:nowrap;position:relative}
.tbt.on{background:#181200;color:var(–gold);border-bottom-color:var(–gold);font-weight:bold}
.badge{position:absolute;top:2px;left:2px;background:var(–gold);color:#000;border-radius:8px;padding:0 5px;font-size:8px;font-weight:bold}

/* CONTENT */
#cnt{padding:12px 14px 60px}
.card{background:linear-gradient(160deg,#0E0D00,#090800);border:1px solid var(–border);border-radius:12px;padding:14px;margin-bottom:10px}
.ctitle{font-size:13px;font-weight:bold;color:var(–gold);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
.sb{background:#080800;border-radius:10px;padding:12px 8px;text-align:center;border:1px solid rgba(255,215,0,.1)}
.sv{font-size:22px;font-weight:900;color:var(–gold);line-height:1;font-variant-numeric:tabular-nums}
.sl{font-size:10px;color:var(–text3);margin-top:4px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:bold;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);color:var(–gold)}
.btn{padding:8px 16px;border-radius:10px;font-size:12px;font-weight:bold;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.4);color:var(–gold)}
.mbox{background:#080800;border-radius:8px;padding:7px 4px;text-align:center}
.mbox-l{font-size:9px;color:var(–text4)}.mbox-v{font-size:11px;font-weight:bold;font-family:monospace}
.tcard-buy{background:#001510;border:1px solid rgba(0,212,170,.25);border-radius:12px;padding:14px;margin-bottom:10px}
.tcard-sell{background:#140003;border:1px solid rgba(255,75,110,.25);border-radius:12px;padding:14px;margin-bottom:10px}
.pbar-wrap{height:4px;background:#1A1A1A;border-radius:2px}
.pbar{height:100%;border-radius:2px;transition:width 1s}
.ict{padding:4px 9px;border-radius:8px;font-size:10px;display:inline-block}
.empty{text-align:center;padding:36px 20px}
.empty-ic{font-size:42px;margin-bottom:10px}
.empty-t{color:var(–text3);font-size:13px}
.empty-s{color:#333;font-size:11px;margin-top:6px}
.ivb{padding:2px 7px;border-radius:6px;font-size:9px;border:1px solid #1E1500;background:transparent;color:#444}
.ivb.on{border-color:var(–gold);background:rgba(255,215,0,.15);color:var(–gold)}
.blf{padding:3px 9px;border-radius:12px;font-size:10px;border:1px solid #1E1500;background:transparent;color:#444}
.blf.on{border-color:var(–gold);background:rgba(255,215,0,.1);color:var(–gold)}
.disc{padding:6px 10px;background:#1A0000;border-radius:8px;font-size:10px;color:#555;margin-top:8px}
#tv-box{height:450px;width:100%;border-radius:12px;overflow:hidden;margin-bottom:10px}
.tradingview-widget-container,.tradingview-widget-container__widget{height:100%!important;width:100%!important}
#footer{padding:12px 14px;border-top:1px solid var(–border2);background:#050500;text-align:center;font-size:10px;color:#1E1800;line-height:2}
@media(max-width:480px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
</style>

</head>
<body>
<div id="hdr">
  <div id="ticker"></div>
  <div id="hdr-main">
    <div class="logo">
      <div class="logo-orb">⚜</div>
      <div>
        <div class="logo-title">نظام التداول التعليمي</div>
        <div class="logo-sub">للأغراض التعليمية فقط · ليست توصيات مالية</div>
      </div>
    </div>
    <div>
      <div id="pboxes"></div>
      <div id="srow" class="sconn"><span class="sdot">●</span><span id="stxt">جاري الاتصال...</span></div>
    </div>
  </div>
  <div id="mkttabs"></div>
</div>
<div id="tabs"></div>
<div id="cnt"></div>
<div id="footer">⚠️ للأغراض التعليمية فقط · الأسعار: Binance API + Metals.live · المخططات: TradingView<br>التداول ينطوي على مخاطر عالية · لا تستثمر أموالاً لا تتحمل خسارتها</div>

<script>
const MKTS=[
  {id:'XAUUSD',tv:'OANDA:XAUUSD',    name:'ذهب / دولار',    icon:'🥇',color:'#FFD700',dec:2},
  {id:'XAUEUR',tv:'OANDA:XAUEUR',    name:'ذهب / يورو',     icon:'🏆',color:'#FFC300',dec:2},
  {id:'BTCUSD',tv:'BINANCE:BTCUSDT', name:'بيتكوين / دولار',icon:'₿', color:'#F7931A',dec:0},
];
const TABS_CFG=[
  {id:'live',   label:'التحليل اللحظي',  icon:'⚡'},
  {id:'trades', label:'الصفقات الحالية', icon:'📊'},
  {id:'backlog',label:'السجل',           icon:'📁'},
  {id:'stats',  label:'الإحصائيات',      icon:'📈'},
  {id:'news',   label:'الأخبار',          icon:'📰'},
  {id:'summary',label:'الملخص اليومي',   icon:'🌙'},
];
const SBL='edu_bl_v5', SAT='edu_at_v5', MAX_BL=200;

// ── STATE ──
const S={
  mkt:'XAUUSD', tab:'live',
  prices:{XAUUSD:'—',XAUEUR:'—',BTCUSD:'—'},
  prev:{XAUUSD:null,XAUEUR:null,BTCUSD:null},
  ps:'connecting',
  an:{}, trades:[], backlog:[], news:[], sum:{},
  load:{}, analyzing:false, blf:'all', iv:'15',
};
try{S.trades=JSON.parse(localStorage.getItem(SAT))||[];}catch{}
try{S.backlog=JSON.parse(localStorage.getItem(SBL))||[];}catch{}

function persist(){
  try{localStorage.setItem(SAT,JSON.stringify(S.trades));}catch{}
  try{localStorage.setItem(SBL,JSON.stringify(S.backlog.slice(0,MAX_BL)));}catch{}
}

// ── HELPERS ──
function now(){
  const d=new Date();
  return{
    date:d.toLocaleDateString('ar-EG',{year:'numeric',month:'2-digit',day:'2-digit'}),
    time:d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),
    iso:d.toISOString(),full:d.toLocaleString('ar-EG'),
  };
}
function mktObj(id){return MKTS.find(m=>m.id===(id||S.mkt));}
function pdir(id){
  const c=parseFloat(S.prices[id]),p=parseFloat(S.prev[id]);
  return !p?'neu':c>p?'up':c<p?'down':'neu';
}
function tag(t,c='#FFD700'){return `<span class="tag" style="color:${c};background:${c}18;border-color:${c}40">${t}</span>`;}
function sb(v,l,c='#FFD700'){return `<div class="sb" style="border-color:${c}22"><div class="sv" style="color:${c}">${v}</div><div class="sl">${l}</div></div>`;}
function mb(l,v,c){return `<div class="mbox"><div class="mbox-l">${l}</div><div class="mbox-v" style="color:${c}">${v}</div></div>`;}

// ── REAL PRICES ──
async function fetchPrices(){
  const o={XAUUSD:null,XAUEUR:null,BTCUSD:null};
  try{const r=await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');const d=await r.json();if(d.price)o.BTCUSD=parseFloat(d.price).toFixed(0);}catch{}
  try{const r=await fetch('https://api.metals.live/v1/spot/gold');const d=await r.json();const g=Array.isArray(d)?d[0]?.gold:d?.gold;if(g){o.XAUUSD=parseFloat(g).toFixed(2);o.XAUEUR=(parseFloat(g)*0.924).toFixed(2);}}catch{}
  if(!o.XAUUSD){try{const r=await fetch('https://min-api.cryptocompare.com/data/price?fsym=XAU&tsyms=USD,EUR');const d=await r.json();if(d.USD)o.XAUUSD=parseFloat(d.USD).toFixed(2);if(d.EUR)o.XAUEUR=parseFloat(d.EUR).toFixed(2);}catch{}}
  return o;
}
async function updatePrices(){
  const p=await fetchPrices();
  S.prev={...S.prices};
  if(p.XAUUSD)S.prices.XAUUSD=p.XAUUSD;
  if(p.XAUEUR)S.prices.XAUEUR=p.XAUEUR;
  if(p.BTCUSD)S.prices.BTCUSD=p.BTCUSD;
  S.ps=(p.BTCUSD||p.XAUUSD)?'live':'error';
  renderHdr();checkTrades();
}

// ── TRADE MONITOR ──
function checkTrades(){
  if(S.ps!=='live')return;
  let ch=false;
  S.trades=S.trades.filter(t=>{
    const price=parseFloat(S.prices[t.market]);if(!price)return true;
    const hsl=(t.type==='BUY'&&price<=t.sl)||(t.type==='SELL'&&price>=t.sl);
    const htp=(t.type==='BUY'&&price>=t.tp)||(t.type==='SELL'&&price<=t.tp);
    if(hsl||htp){
      const m=mktObj(t.market),ts=now();
      S.backlog.unshift({...t,closePrice:price.toFixed(m?.dec??2),result:htp?'ربح':'خسارة',resultColor:htp?'#00D4AA':'#FF4B6E',closedDate:ts.date,closedTime:ts.time,closedIso:ts.iso});
      S.backlog=S.backlog.slice(0,MAX_BL);ch=true;return false;
    }
    return true;
  });
  if(ch){persist();render();renderBadge();}
}

// ── AI ──
async function ai(msg){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:'أنت نظام تعليمي لتحليل أسواق التداول. كل ما تنتجه للأغراض التعليمية فقط وليس توصيات مالية. أجب دائماً بـ JSON فقط بدون أي نص خارجه.',messages:[{role:'user',content:msg}]})});
  const data=await r.json();
  const txt=data.content?.map(b=>b.text||'').join('')||'';
  try{return JSON.parse(txt.replace(/```json|```/g,'').trim());}catch{return{raw:txt};}
}

// ── TRADINGVIEW ──
function loadTicker(){
  const w=document.getElementById('ticker');if(!w)return;
  w.innerHTML='';
  const c=document.createElement('div');c.className='tradingview-widget-container';c.style.height='46px';
  const s=document.createElement('script');s.src='https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js';s.async=true;
  s.innerHTML=JSON.stringify({symbols:[{description:'ذهب/دولار',proName:'OANDA:XAUUSD'},{description:'ذهب/يورو',proName:'OANDA:XAUEUR'},{description:'BTC/USDT',proName:'BINANCE:BTCUSDT'},{description:'EUR/USD',proName:'FX:EURUSD'},{description:'DXY',proName:'TVC:DXY'},{description:'S&P500',proName:'SP:SPX'}],showSymbolLogo:true,colorTheme:'dark',isTransparent:true,displayMode:'compact',locale:'ar'});
  c.appendChild(s);w.appendChild(c);
}
function loadChart(sym,iv){
  const b=document.getElementById('tv-box');if(!b)return;
  b.innerHTML='';
  const w=document.createElement('div');w.className='tradingview-widget-container';w.style.height='100%';
  const i=document.createElement('div');i.className='tradingview-widget-container__widget';i.style.height='100%';
  const s=document.createElement('script');s.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';s.async=true;
  s.innerHTML=JSON.stringify({autosize:true,symbol:sym,interval:iv,timezone:'Asia/Riyadh',theme:'dark',style:'1',locale:'ar',toolbar_bg:'#0A0A0A',enable_publishing:false,withdateranges:true,hide_side_toolbar:false,allow_symbol_change:false,save_image:false,studies:['STD;EMA','STD;RSI','STD;VWAP'],backgroundColor:'#080808',gridColor:'#111100',show_popup_button:true,popup_width:'1000',popup_height:'650'});
  w.appendChild(i);w.appendChild(s);b.appendChild(w);
}

// ── STATS ──
function stats(mid){
  const a=S.backlog.filter(t=>t.market===mid);
  const wr=arr=>arr.length?((arr.filter(t=>t.result==='ربح').length/arr.length)*100).toFixed(1):'—';
  let st=0,best=0;for(const t of a){if(t.result==='ربح'){st++;best=Math.max(best,st);}else st=0;}
  return{total:a.length,wins:a.filter(t=>t.result==='ربح').length,losses:a.filter(t=>t.result==='خسارة').length,wr50:wr(a.slice(0,50)),wr100:wr(a.slice(0,100)),wr200:wr(a.slice(0,200)),buys:a.filter(t=>t.type==='BUY').length,sells:a.filter(t=>t.type==='SELL').length,best};
}

// ── PROFIT CURVE ──
function curve(mid){
  const d=[...S.backlog].filter(t=>t.market===mid).slice(0,50).reverse();
  if(d.length<2)return '<div style="text-align:center;color:#333;padding:16px;font-size:11px">لا توجد بيانات كافية بعد</div>';
  let cum=0;const pts=d.map((t,i)=>{cum+=(t.result==='ربح'?1:-1);return{i,cum};});
  const mx=Math.max(...pts.map(p=>p.cum)),mn=Math.min(...pts.map(p=>p.cum)),rng=mx-mn||1;
  const W=280,H=70,ps=pts.map(p=>`${(p.i/(pts.length-1))*W},${H-((p.cum-mn)/rng)*H}`).join(' ');
  const c=pts[pts.length-1].cum>=0?'#00D4AA':'#FF4B6E';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:80px" preserveAspectRatio="none"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${c}" stop-opacity=".35"/><stop offset="100%" stop-color="${c}" stop-opacity="0"/></linearGradient></defs><polygon points="0,${H} ${ps} ${W},${H}" fill="url(#cg)"/><polyline points="${ps}" fill="none" stroke="${c}" stroke-width="1.8"/></svg>`;
}

// ══════════════════════════════════════
// RENDER HEADER
// ══════════════════════════════════════
function renderHdr(){
  const pb=document.getElementById('pboxes');
  if(pb)pb.innerHTML=MKTS.map(m=>{const d=pdir(m.id),ar=d==='up'?'▲':d==='down'?'▼':'●';return `<div class="pbox ${d}"><span class="pbox-icon" style="color:${m.color}">${m.icon}</span><span class="pbox-id">${m.id}</span><span class="pbox-val">${S.prices[m.id]}</span><span class="pbox-arr">${ar}</span></div>`;}).join('');
  const sr=document.getElementById('srow'),st=document.getElementById('stxt');
  if(sr)sr.className=`slive`[S.ps==='live'?0:1]||({live:'slive',connecting:'sconn',error:'serr'}[S.ps]||'sconn');
  if(sr){sr.className='';sr.classList.add({live:'slive',connecting:'sconn',error:'serr'}[S.ps]||'sconn');}
  if(st)st.textContent=S.ps==='live'?'أسعار حقيقية لحظية':S.ps==='connecting'?'جاري الاتصال...':'فشل جلب الأسعار';
}
function renderMktTabs(){
  const w=document.getElementById('mkttabs');if(!w)return;
  w.innerHTML=MKTS.map(m=>`<button class="mbt${S.mkt===m.id?' on':''}" style="${S.mkt===m.id?`border-color:${m.color};color:${m.color};background:${m.color}18`:''}" onclick="selMkt('${m.id}')">${m.icon} ${m.name}</button>`).join('');
}
function renderTabsEl(){
  const w=document.getElementById('tabs');if(!w)return;
  w.innerHTML=TABS_CFG.map(t=>`<button class="tbt${S.tab===t.id?' on':''}" onclick="selTab('${t.id}')">${t.icon} ${t.label}</button>`).join('');
  renderBadge();
}
function renderBadge(){
  document.querySelectorAll('.tbt').forEach((b,i)=>{if(TABS_CFG[i]?.id==='trades'){let bd=b.querySelector('.badge');if(S.trades.length>0){if(!bd){bd=document.createElement('span');bd.className='badge';b.appendChild(bd);}bd.textContent=S.trades.length;}else if(bd)bd.remove();}});
}

// ══════════════════════════════════════
// RENDER CONTENT
// ══════════════════════════════════════
function render(){
  const w=document.getElementById('cnt');if(!w)return;
  const m=mktObj();
  const map={live:renderLive,trades:renderTrades,backlog:renderBL,stats:renderStats,news:renderNews,summary:renderSum};
  w.innerHTML=(map[S.tab]||renderLive)(m);
  if(S.tab==='live')setTimeout(()=>loadChart(m.tv,S.iv),60);
}

// ══════════════════════════════════════
// LIVE TAB
// ══════════════════════════════════════
function renderLive(m){
  const ivs=[['1','1د'],['5','5د'],['15','15د'],['30','30د'],['60','H1'],['240','H4'],['D','يومي']];
  const ivBtns=ivs.map(([v,l])=>`<button class="ivb${S.iv===v?' on':''}" style="${S.iv===v?`border-color:${m.color};color:${m.color};background:${m.color}18`:''}" onclick="setIv('${v}')">${l}</button>`).join('');
  const an=S.an[m.id];
  const ts=an?.ft?`آخر تحليل: ${an.ft.time} · ${an.ft.date}`:'';
  const abtn=S.analyzing?`<span class="sh">⏳ الذكاء الاصطناعي يحلل...</span>`:`🤖 تحليل AI الآن`;

  let body='';
  if(!an){body=`<div class="card empty"><div class="empty-ic">🤖</div><div class="empty-t" style="color:var(--gold);font-size:14px;font-weight:bold">اضغط "تحليل AI الآن"</div><div class="empty-s">سيحلل الذكاء الاصطناعي ${m.id} على السعر الحقيقي ${S.prices[m.id]}</div></div>`;}
  else if(an.raw){body=`<div class="card"><div style="color:var(--red);font-size:11px">خطأ. حاول مجدداً.</div></div>`;}
  else{
    const tc=an.trend==='صاعد'?'#00D4AA':an.trend==='هابط'?'#FF4B6E':'#FFD700';
    const ti=an.trend==='صاعد'?'▲':an.trend==='هابط'?'▼':'◆';
    const dz=(an.demandZones||[]).map(z=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #141000;font-size:11px"><span style="color:#00D4AA;font-family:monospace;font-weight:bold">${z.level}</span><div>${tag(z.strength,'#00D4AA')}${z.type==='fresh'?tag('fresh','#00BFFF'):''}</div></div>`).join('');

      ...(an.orderBlocks||[]).map(o=>`<div class="ict" style="background:#0A0015;border:1px solid #9B59B630"><span style="color:#9B59B6;font-weight:bold">OB ${o.type} </span><span style="color:#444">@ ${o.level} (${o.timeframe})</span></div>`),
      ...(an.liquidityZones||[]).map(l=>`<div class="ict" style="background:#0F0D00;border:1px solid #FFD70028"><span style="color:#FFD700;font-weight:bold">💧 ${l.type} </span><span style="color:#444">@ ${l.level} — ${l.side==='above'?'فوق':'تحت'}</span></div>`),

        <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px">${tfs}</div>
        <div class="disc">⚠️ صفقة تعليمية فقط — ليست توصية مالية</div>

    body=`
    <div class="card">

function renderTrades(m){
  const tr=S.trades.filter(t=>t.market===m.id);
  if(!tr.length)return `<div class="card row"><span style="color:var(--gold);font-weight:bold">📊 الصفقات النشطة — ${m.name}</span>${tag('0 صفقة',m.color)}</div><div class="card empty"><div class="empty-ic">📭</div><div class="empty-t">لا توجد صفقات نشطة</div><div class="empty-s">افتح التحليل اللحظي وشغّل الذكاء الاصطناعي</div></div>`;
  const cards=tr.map(t=>{
    const cur=parseFloat(S.prices[t.market])||t.entry;
    const c=t.type==='BUY'?'#00D4AA':'#FF4B6E';
    const pr=Math.min(100,Math.max(0,t.type==='BUY'?((cur-t.entry)/(t.tp-t.entry)*100):((t.entry-cur)/(t.entry-t.tp)*100)));
    const tfs=(t.timeframes||[]).map(tf=>tag(tf,'#333')).join('');
    return `<div class="${t.type==='BUY'?'tcard-buy':'tcard-sell'}">
      <div class="row" style="margin-bottom:10px">
        <div style="display:flex;gap:6px;align-items:center">${tag((t.type==='BUY'?'▲ شراء':'▼ بيع')+' '+t.market,c)}<span class="tag blink" style="color:#00D4AA;background:#00D4AA18;border-color:#00D4AA40;font-size:9px">● نشطة</span></div>
        <div style="text-align:left;font-size:10px;color:#444"><div>📅 ${t.openDate}</div><div>🕐 ${t.openTime}</div></div>
      </div>
      <div class="g4" style="margin-bottom:10px">${mb('الدخول',t.entry,'#FFD700')}${mb('الوقف',t.sl,'#FF4B6E')}${mb('الهدف',t.tp,'#00D4AA')}${mb('الآن',S.prices[t.market],c)}</div>
      <div style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:#444;margin-bottom:3px"><span>التقدم نحو الهدف</span><span style="color:${c}">${pr.toFixed(0)}%</span></div>
        <div class="pbar-wrap"><div class="pbar" style="width:${pr}%;background:linear-gradient(90deg,${c}60,${c})"></div></div>
      </div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px">${tag('R:R '+t.rr,'#9B59B6')}${tag('ثقة '+t.confidence+'%','#FFD700')}${tag('توافق '+t.alignment+'%','#00BFFF')}${tfs}</div>
      <div style="font-size:10px;color:#555;line-height:1.5">📋 ${t.reason||''}</div>
    </div>`;
  }).join('');
  return `<div class="card row"><span style="color:var(--gold);font-weight:bold">📊 الصفقات النشطة — ${m.name}</span>${tag(tr.length+' صفقة',m.color)}</div>${cards}`;
}

    <div style="text-align:center"><div style="font-size:18px;font-weight:900;color:#FF4B6E">${fl.filter(t=>t.result==='خسارة').length}</div><div style="font-size:9px;color:#444">خسائر</div></div>

async function runAn(){
  if(S.analyzing)return;
  const m=mktObj(),price=S.prices[m.id];
  S.analyzing=true;render();
  try{
    const p=parseFloat(price),d=m.dec;
    const res=await ai(`حلّل سوق ${m.id} تعليمياً. السعر الحقيقي: ${price}. الوقت: ${now().full}.
أعد JSON هذا فقط (لا تضف أي نص خارجه):
{"trend":"صاعد","trendStrength":70,"trendConfidence":80,"bias":"توجه عام مفصل بناءً على السعر ${price}","demandZones":[{"level":${(p*.995).toFixed(d)},"strength":"قوية","type":"fresh"},{"level":${(p*.988).toFixed(d)},"strength":"متوسطة","type":"tested"}],"supplyZones":[{"level":${(p*1.008).toFixed(d)},"strength":"قوية","type":"fresh"},{"level":${(p*1.015).toFixed(d)},"strength":"ضعيفة","type":"tested"}],"liquidityZones":[{"level":${(p*1.006).toFixed(d)},"type":"Equal Highs","side":"above"},{"level":${(p*.993).toFixed(d)},"type":"Equal Lows","side":"below"}],"bos":{"detected":true,"direction":"صاعد","level":${(p*.998).toFixed(d)},"timeframe":"M15"},"fvg":[{"from":${(p*.996).toFixed(d)},"to":${(p*.998).toFixed(d)},"filled":false}],"orderBlocks":[{"level":${(p*.993).toFixed(d)},"type":"bullish","timeframe":"H1"}],"keyPatterns":["نمط شمعة تعليمي 1","نمط شمعة تعليمي 2"],"bullScenario":"سيناريو صعود تعليمي مفصل","bearScenario":"سيناريو هبوط تعليمي مفصل","timeframeAlignment":82,"tradeSignal":{"exists":true,"type":"BUY","entry":${price},"sl":${(p*.994).toFixed(d)},"tp":${(p*1.012).toFixed(d)},"rr":"1:2","confidence":82,"reason":"سبب الدخول التعليمي المفصل مع المستويات الفنية","timeframes":["Daily","H4","H1","M15"]}}`);
    S.an[m.id]={...res,ft:now()};
    if(res.tradeSignal?.exists&&!res.raw){
      const s=res.tradeSignal,ts=now();
      if(!S.trades.find(x=>x.market===m.id&&x.type===s.type)){
        S.trades.unshift({id:Date.now(),market:m.id,type:s.type,entry:parseFloat(s.entry),sl:parseFloat(s.sl),tp:parseFloat(s.tp),rr:s.rr,confidence:s.confidence,alignment:res.timeframeAlignment,reason:s.reason,timeframes:s.timeframes,openDate:ts.date,openTime:ts.time,openIso:ts.iso,openFull:ts.full,status:'نشطة'});
        persist();
      }
    }
  }catch(e){console.error(e);}
  S.analyzing=false;render();renderBadge();
}

async function fetchNws(){
  if(S.load.news)return;
  S.load.news=true;render();
  try{
    const p=S.prices;
    const r=await ai(`أنشئ 6 أخبار تعليمية واقعية عن الذهب والعملات والبيتكوين. XAUUSD=${p.XAUUSD}, BTC=${p.BTCUSD}.
JSON فقط: {"news":[{"title":"","summary":"","impact":"قوي","markets":["XAUUSD"],"direction":"صاعد","category":"فيدرالي","time":"منذ ساعة"}]}`);
    if(r.news)S.news=r.news;
  }catch{}
  S.load.news=false;render();
}

async function fetchSum(){
  if(S.load.summary)return;
  const m=mktObj();
  S.load.summary=true;render();
  try{
    const r=await ai(`ملخص يومي تعليمي لـ ${m.id}. السعر الحقيقي: ${S.prices[m.id]}. التاريخ: ${now().date}.
JSON فقط: {"whatHappened":"","whyMoved":"","keyLevels":[{"level":0,"type":"دعم قوي"}],"tomorrowBias":"","tomorrowScenarios":["سيناريو 1","سيناريو 2"]}`);
    S.sum[m.id]=r;
  }catch{}
  S.load.summary=false;render();
}
